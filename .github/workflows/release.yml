name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      # A macOS signing failure must not cancel Windows and Linux after they have built.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder reads version from apps/electron/package.json; keep artifacts aligned with the git tag.
      - name: Sync Electron package version from release tag
        shell: bash
        env:
          SYNC_ELECTRON_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${SYNC_ELECTRON_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not derive semver from tag: ${SYNC_ELECTRON_VERSION}"
            exit 1
          fi
          export VERSION
          node -e "
            const fs = require('fs');
            const path = 'apps/electron/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Decode macOS signing assets
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_CONNECT_API_KEY }}
        run: |
          WORKSPACE_DIR=$(pwd)
          echo "$CSC_LINK_B64" | base64 --decode > "$WORKSPACE_DIR/certificate.p12"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$WORKSPACE_DIR/AuthKey.p8"
          echo "CSC_P12=$WORKSPACE_DIR/certificate.p12" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$WORKSPACE_DIR/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Setup macOS keychain
        if: matrix.os == 'macos-latest'
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # electron-builder 25 creates its own keychain, then runs
          # set-key-partition-list with the .p12 password. macOS 26 rejects that
          # (SecKeychainUnlock). Import here and pass CSC_KEYCHAIN only.
          # Do not set CSC_LINK, or electron-builder takes the broken path.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=temp123

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          security import "$CSC_P12" \
            -k "$KEYCHAIN" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build Electron app
        run: pnpm --filter electron run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_ISSUER_ID }}
          # Same URL as apps/electron/.env_prod_example — set repo secret ELECTRON_API_BASE_URL (no trailing /api).
          MAIN_VITE_API_BASE_URL: ${{ secrets.ELECTRON_API_BASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.ELECTRON_API_BASE_URL }}

      - name: Notarization history (macOS, on failure/cancel)
        if: (failure() || cancelled()) && matrix.os == 'macos-latest'
        run: |
          xcrun notarytool history \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"
        env:
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_ISSUER_ID }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/*.exe
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
            apps/electron/dist/*.yml
            apps/electron/dist/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
